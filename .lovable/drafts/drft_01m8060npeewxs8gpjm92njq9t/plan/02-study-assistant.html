<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مخطط مساعد الطالب">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); font-size: 14px; font-weight: 480; }
    .small { font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: var(--bg-secondary); stroke: var(--fg-secondary); stroke-width: 1; }
    .quiet { fill: var(--bg-muted); stroke: var(--border-translucent); }
    .accent { fill: var(--bg-accent-translucent); stroke: var(--fg-accent); }
    .accentText { fill: var(--fg-accent); }
  </style>
  <rect x="70" y="20" width="500" height="355" rx="16" class="box"/>
  <text x="320" y="52" text-anchor="middle" style="font-size:18px;font-weight:700">مساعد الطالب</text>
  <text x="320" y="73" text-anchor="middle" class="small">اسأل، صوّر الواجب، أو تحدّث</text>

  <rect x="96" y="94" width="212" height="38" rx="8" class="quiet"/>
  <text x="202" y="118" text-anchor="middle">المرحلة الدراسية</text>
  <rect x="332" y="94" width="212" height="38" rx="8" class="accent"/>
  <text x="438" y="118" text-anchor="middle" class="accentText">المادة: الرياضيات</text>

  <g>
    <rect x="96" y="151" width="102" height="36" rx="18" class="quiet"/><text x="147" y="174" text-anchor="middle" class="small">اشرح لي</text>
    <rect x="210" y="151" width="102" height="36" rx="18" class="accent"/><text x="261" y="174" text-anchor="middle" class="small accentText">حلّ معي</text>
    <rect x="324" y="151" width="102" height="36" rx="18" class="quiet"/><text x="375" y="174" text-anchor="middle" class="small">اختبرني</text>
    <rect x="438" y="151" width="106" height="36" rx="18" class="quiet"/><text x="491" y="174" text-anchor="middle" class="small">لخّص الدرس</text>
  </g>

  <rect x="96" y="208" width="448" height="86" rx="12" class="quiet"/>
  <text x="522" y="235" text-anchor="end" class="small">كيف أحل معادلة من الدرجة الأولى؟</text>
  <rect x="112" y="249" width="145" height="28" rx="8" class="box"/>
  <text x="184" y="267" text-anchor="middle" class="small">+ صورة السؤال</text>
  <rect x="474" y="246" width="52" height="36" rx="18" class="accent"/>
  <text x="500" y="269" text-anchor="middle" class="accentText">إرسال</text>

  <rect x="182" y="315" width="362" height="40" rx="12" class="box"/>
  <text x="363" y="339" text-anchor="middle" class="small">نرتّب المعادلة، ثم نعزل المجهول، ثم نتحقق من الناتج</text>
</svg>
